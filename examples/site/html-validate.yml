name: HTML

on:
  pull_request:
    paths: ["**/*.html"]
  push:
    branches: [main]
    paths: ["**/*.html"]

jobs:
  html:
    permissions:
      contents: read
    uses: OWNER/gha-shared-workflows/.github/workflows/site-html-validate.yml@v1
    with:
      paths: "**/*.html"
      # Relax stylistic rules; keep structure and accessibility rules as errors.
      rules: no-inline-style:off,doctype-style:off
