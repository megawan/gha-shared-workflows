name: Dependency Review

on: pull_request

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
    uses: OWNER/gha-shared-workflows/.github/workflows/security-dependency-review.yml@v1
    with:
      fail-on-severity: high
      deny-licenses: GPL-3.0-only, AGPL-3.0-only
