name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  codeql:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: OWNER/gha-shared-workflows/.github/workflows/security-codeql.yml@v1
    with:
      languages: '["javascript-typescript", "python"]'
