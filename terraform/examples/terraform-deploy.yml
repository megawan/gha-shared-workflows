name: Terraform Deploy

on:
  push:
    branches: [main]
    paths:
      - "infra/**"

jobs:
  validate:
    permissions:
      contents: read
    uses: OWNER/gha-shared-workflows/.github/workflows/terraform-validate.yml@v1
    with:
      working-directory: infra
      terraform-version: "1.9.8"

  apply:
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: OWNER/gha-shared-workflows/.github/workflows/terraform-apply.yml@v1
    with:
      working-directory: infra
      terraform-version: "1.9.8"
      environment: production
      cloud-provider: aws
      aws-region: eu-west-1
      plan-aws-role-arn: arn:aws:iam::123456789012:role/terraform-plan
      aws-role-arn: arn:aws:iam::123456789012:role/terraform-apply
