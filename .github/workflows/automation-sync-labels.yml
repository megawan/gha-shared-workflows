name: Sync Labels

# Syncs repository labels with a definition file (default: .github/labels.yml) in the caller repo.
# Callers typically use the `push` (paths: labels file) and `workflow_dispatch` triggers.

on:
  workflow_call:
    inputs:
      labels-file:
        description: "Path to the label definition file in the caller repo."
        type: string
        default: .github/labels.yml
      skip-delete:
        description: "Do not delete labels that are absent from the definition file."
        type: boolean
        default: true
      dry-run:
        description: "Simulate only, without changing labels."
        type: boolean
        default: false

permissions: {}

jobs:
  sync:
    name: Sync repository labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ inputs.labels-file }}
          sparse-checkout-cone-mode: false

      - uses: crazy-max/ghaction-github-labeler@v6
        with:
          github-token: ${{ github.token }}
          yaml-file: ${{ inputs.labels-file }}
          skip-delete: ${{ inputs.skip-delete }}
          dry-run: ${{ inputs.dry-run }}
