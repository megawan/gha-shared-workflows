name: Stale

# Marks and then closes inactive issues and PRs.
# Callers typically use the `schedule` and `workflow_dispatch` triggers.

on:
  workflow_call:
    inputs:
      days-before-stale:
        description: "Days of inactivity before an item is labeled stale."
        type: number
        default: 60
      days-before-close:
        description: "Days after being marked stale before closing. -1 never closes."
        type: number
        default: 14
      stale-label:
        type: string
        default: stale
      exempt-labels:
        description: "Comma-separated labels that are never considered stale."
        type: string
        default: "pinned,security,keep-open"
      stale-issue-message:
        type: string
        default: "This issue has been marked stale due to inactivity. It will be closed automatically if there is no further activity."
      stale-pr-message:
        type: string
        default: "This pull request has been marked stale due to inactivity. It will be closed automatically if there is no further activity."
      operations-per-run:
        type: number
        default: 100
      dry-run:
        description: "Simulate only, without changing anything."
        type: boolean
        default: false

permissions: {}

jobs:
  stale:
    name: Mark stale issues and PRs
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ github.token }}
          days-before-stale: ${{ inputs.days-before-stale }}
          days-before-close: ${{ inputs.days-before-close }}
          stale-issue-label: ${{ inputs.stale-label }}
          stale-pr-label: ${{ inputs.stale-label }}
          exempt-issue-labels: ${{ inputs.exempt-labels }}
          exempt-pr-labels: ${{ inputs.exempt-labels }}
          stale-issue-message: ${{ inputs.stale-issue-message }}
          stale-pr-message: ${{ inputs.stale-pr-message }}
          operations-per-run: ${{ inputs.operations-per-run }}
          debug-only: ${{ inputs.dry-run }}
