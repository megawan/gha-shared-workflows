name: CodeQL

# Static analysis with CodeQL, one job per language, with results in code scanning.
# Callers typically use `push`, `pull_request` and a weekly `schedule`.
# Code scanning is free for public repos and needs GitHub Code Security on private repos.

on:
  workflow_call:
    inputs:
      languages:
        description: >-
          JSON array of CodeQL languages, e.g. ["javascript-typescript","python"].
          Supported: actions, c-cpp, csharp, go, java-kotlin, javascript-typescript, python, ruby, swift, rust.
        type: string
        required: true
      build-mode:
        description: "none | autobuild | manual. Interpreted languages and C#, Java, Rust support none."
        type: string
        default: none
      build-command:
        description: "Build command, used when build-mode is manual."
        type: string
        default: ""
      queries:
        description: "Query suite or packs, e.g. security-extended or security-and-quality. Empty uses the default suite."
        type: string
        default: security-extended
      config-file:
        description: "Path to a CodeQL configuration file in the caller repo. Empty uses none."
        type: string
        default: ""
      working-directory:
        description: "Directory in which the manual build command runs."
        type: string
        default: .

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ inputs.build-mode }}
          queries: ${{ inputs.queries }}
          config-file: ${{ inputs.config-file }}

      - name: Manual build
        if: inputs.build-mode == 'manual'
        working-directory: ${{ inputs.working-directory }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          if [[ -z "$BUILD_COMMAND" ]]; then
            echo "::error::build-command is required when build-mode is manual"
            exit 1
          fi
          bash -c "$BUILD_COMMAND"

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
