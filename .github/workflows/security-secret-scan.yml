name: Secret Scan

# Scans commits for leaked secrets with gitleaks. On pull requests only the commits of
# the PR are scanned, on pushes only the pushed commits, otherwise the full history.
# Matches are redacted in the logs. The release tarball is verified against the
# checksums published with the release.

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: "gitleaks version without the leading v."
        type: string
        default: "8.30.1"
      config-path:
        description: "Path to a gitleaks config file in the caller repo. Empty uses the built-in rules."
        type: string
        default: ""
      scan-full-history:
        description: "Always scan the full git history instead of only new commits."
        type: boolean
        default: false
      upload-sarif:
        description: "Upload findings to GitHub code scanning (requires code scanning to be available)."
        type: boolean
        default: false

permissions: {}

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${VERSION}_checksums.txt"
          dir="$(mktemp -d)"
          curl -fsSL -o "${dir}/${archive}" "${base}/${archive}"
          curl -fsSL -o "${dir}/${checksums}" "${base}/${checksums}"
          (cd "$dir" && grep " ${archive}\$" "$checksums" | sha256sum --check -)
          tar -xzf "${dir}/${archive}" -C "$dir" gitleaks
          install -m 0755 "${dir}/gitleaks" "${RUNNER_TEMP}/gitleaks"

      - name: Scan
        env:
          FULL_HISTORY: ${{ inputs.scan-full-history }}
          CONFIG_PATH: ${{ inputs.config-path }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(git --redact --no-banner --report-format sarif --report-path gitleaks.sarif)
          if [[ -n "$CONFIG_PATH" ]]; then
            args+=(--config "$CONFIG_PATH")
          fi
          if [[ "$FULL_HISTORY" != "true" ]]; then
            if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "pull_request_target" ]]; then
              args+=(--log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}")
            elif [[ "$EVENT_NAME" == "push" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              args+=(--log-opts="${PUSH_BEFORE}..${PUSH_AFTER}")
            fi
          fi
          args+=(.)
          "${RUNNER_TEMP}/gitleaks" "${args[@]}"

      - name: Upload SARIF
        if: always() && inputs.upload-sarif && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
